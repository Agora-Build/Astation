[package]
name = "station-relay-server"
version = "0.1.0"
edition = "2021"

[features]
# Enabled only in builds approved for hosted API rollout.
hosted-agent-api = []
# Separate rollout gate while Auth/Portal finalize host-work token consent.
host-work-api = ["hosted-agent-api"]
# Opt-in joint-test build; production activation remains a separate release gate.
delegated-host-work = []

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
urlencoding = "2.1"
url = "2.5"
tower_governor = "0.4"
governor = "0.6"
validator = { version = "0.18", features = ["derive"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
base64 = "0.22"
# Proxy-kind verification uses the reviewed shared core; native forwards proofs opaquely.
atem-client = { git = "https://github.com/Agora-Build/Atem.git", rev = "5319070c93df7681f73a813d2d0267450a8ac2f9" }
# Astation relay-identity proofs (ECDSA P-256); already in the tree via rustls.
ring = "0.17"
zeroize = "1"
# Shared relay state across replicas (REDIS_URL): commands with automatic
# reconnect, pub/sub, Lua scripts. Valkey-compatible.
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "script", "keep-alive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
atem-client = { git = "https://github.com/Agora-Build/Atem.git", rev = "5319070c93df7681f73a813d2d0267450a8ac2f9", features = ["software-keys"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
