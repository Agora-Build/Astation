name: Deploy Station

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Keep image publication and the relay and webapp deployments in one serial run.
concurrency:
  group: station-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: relay-server
            image: station-relay-server
          - context: webapp
            image: station-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:main
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Relays deploy one at a time, in RELAY_DEPLOY_HOOKS order (one deploy
      # hook URL per line, any webhook-capable platform). For each: trigger,
      # wait for the Coolify deployment when COOLIFY_API_TOKEN is set, then
      # wait for /health before the next one, so the other relays keep serving
      # while one restarts. Any failure stops the run. With RELAY_DEPLOY_HOOKS
      # unset it falls back to COOLIFY_RELAY_SERVER_WEBHOOK_URL, then
      # COOLIFY_RELAY_B_WEBHOOK_URL if set.
      # STATION_MIN_REPLICAS / STATION_REQUIRE_REDIS are opt-in: unset repo
      # variables mean "not checked", so a single relay without Redis passes.
      - name: Deploy relays one at a time, waiting for health after each
        env:
          RELAY_DEPLOY_HOOKS: ${{ secrets.RELAY_DEPLOY_HOOKS }}
          COOLIFY_RELAY_SERVER_WEBHOOK_URL: ${{ secrets.COOLIFY_RELAY_SERVER_WEBHOOK_URL }}
          COOLIFY_RELAY_B_WEBHOOK_URL: ${{ secrets.COOLIFY_RELAY_B_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          STATION_MIN_REPLICAS: ${{ vars.STATION_MIN_REPLICAS }}
          STATION_REQUIRE_REDIS: ${{ vars.STATION_REQUIRE_REDIS }}
        run: |
          set -euo pipefail
          # Mask each hook on its own (trimmed, as the script reads it).
          while IFS= read -r hook || [ -n "$hook" ]; do
            hook="$(printf '%s' "$hook" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$hook" ]; then echo "::add-mask::$hook"; fi
          done <<< "${RELAY_DEPLOY_HOOKS:-}"
          node .github/scripts/deploy-relays.mjs
      - name: Deploy webapp and wait for Coolify
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBAPP_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: node .github/scripts/deploy-coolify.mjs
      - name: Verify public HTTPS, relay health and identity WebSocket
        env:
          STATION_MIN_REPLICAS: ${{ vars.STATION_MIN_REPLICAS }}
          STATION_REQUIRE_REDIS: ${{ vars.STATION_REQUIRE_REDIS }}
        run: node .github/scripts/verify-station.mjs
