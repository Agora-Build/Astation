name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse (X.Y.Z); builds signed artifacts without publishing
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: astation-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Check public release prerequisites
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require distribution signing and notarization
        id: check
        env:
          ASTATION_RELEASE_REF: ${{ inputs.version || github.ref_name }}
          ASTATION_SIGNING_TEAM_ID: ${{ secrets.ASTATION_SIGNING_TEAM_ID }}
          ASTATION_APPLICATION_IDENTITY: ${{ secrets.ASTATION_APPLICATION_IDENTITY }}
          ASTATION_INSTALLER_IDENTITY: ${{ secrets.ASTATION_INSTALLER_IDENTITY }}
          ASTATION_SIGNING_CERTIFICATES_BASE64: ${{ secrets.ASTATION_SIGNING_CERTIFICATES_BASE64 }}
          ASTATION_SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.ASTATION_SIGNING_CERTIFICATES_PASSWORD }}
          ASTATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.ASTATION_PROVISIONING_PROFILE_BASE64 }}
          ASTATION_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.ASTATION_NOTARY_PRIVATE_KEY_BASE64 }}
          ASTATION_NOTARY_KEY_ID: ${{ secrets.ASTATION_NOTARY_KEY_ID }}
          ASTATION_NOTARY_ISSUER_ID: ${{ secrets.ASTATION_NOTARY_ISSUER_ID }}
        run: |
          version="$(python3 scripts/release_signing.py preflight)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-core:
    name: Build C++ Core Library
    needs: prepare-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2 (Foundation Models SDK)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Cache Agora SDK
        uses: actions/cache@v4
        with:
          path: third_party/agora
          key: agora-sdk-macos-4.7.0-sck

      - name: Configure astation_core (download SDK if needed)
        run: |
          SDK_DIR="third_party/agora"
          if [ -d "$SDK_DIR/rtc_mac" ]; then
            cmake -S . -B build -DBUILD_TESTING=ON -DAGORA_SKIP_DOWNLOAD=ON -DAGORA_SDK_DIR="$SDK_DIR"
          else
            if [ "${AGORA_SKIP_DOWNLOAD:-}" = "1" ]; then
              echo "AGORA_SKIP_DOWNLOAD=1 but SDK missing at $SDK_DIR" >&2
              exit 1
            fi
            cmake -S . -B build -DBUILD_TESTING=ON
          fi

      - name: Build astation_core static library
        run: |
          cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run core tests
        run: cd build && ctest --output-on-failure

      - name: Upload core library
        uses: actions/upload-artifact@v4
        with:
          name: libastation_core
          path: build/libastation_core.a

  build-app:
    name: Build macOS App
    needs: [prepare-release, build-core]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2 (Foundation Models SDK)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: libastation_core
          path: build/

      - name: Cache Agora SDK
        uses: actions/cache@v4
        with:
          path: third_party/agora
          key: agora-sdk-macos-4.7.0-sck

      - name: Download Agora SDK for bundling (if needed)
        run: |
          SDK_DIR="third_party/agora"
          if [ -d "$SDK_DIR/rtc_mac" ]; then
            cmake -S . -B build-sdk -DBUILD_TESTING=OFF -DAGORA_SKIP_DOWNLOAD=ON -DAGORA_SDK_DIR="$SDK_DIR"
          else
            if [ "${AGORA_SKIP_DOWNLOAD:-}" = "1" ]; then
              echo "AGORA_SKIP_DOWNLOAD=1 but SDK missing at $SDK_DIR" >&2
              exit 1
            fi
            cmake -S . -B build-sdk -DBUILD_TESTING=OFF
          fi

      - name: Build Swift package
        run: swift build -c release

      - name: Create app bundle
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          APP_DIR="Astation.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"
          mkdir -p "$APP_DIR/Frameworks"

          cp .build/release/astation "$APP_DIR/MacOS/Astation"

          # SwiftPM model manifests and FluidAudio resources must ship with the app.
          for resource in .build/release/*.bundle; do
            [ -d "$resource" ] || continue
            ditto "$resource" "$APP_DIR/Resources/$(basename "$resource")"
          done

          # Bundle Agora RTC SDK frameworks into the app
          AGORA_LIBS="third_party/agora/rtc_mac"
          PLATFORM="macos-arm64_x86_64"
          for xcfw in "$AGORA_LIBS"/*.xcframework; do
            FW_NAME=$(basename "$xcfw" .xcframework)
            FW_PATH="$xcfw/$PLATFORM/$FW_NAME.framework"
            if [ -d "$FW_PATH" ]; then
              cp -R "$FW_PATH" "$APP_DIR/Frameworks/"
              echo "Bundled: $FW_NAME.framework"
            fi
          done

          # AgoraRtcKit links aosl transitively through its SwiftPM package.
          AOSL_FRAMEWORK=".build/artifacts/agorainfra_macos/aosl/aosl.xcframework/$PLATFORM/aosl.framework"
          if [ ! -d "$AOSL_FRAMEWORK" ]; then
            echo "Missing SwiftPM artifact: $AOSL_FRAMEWORK" >&2
            exit 1
          fi
          cp -R "$AOSL_FRAMEWORK" "$APP_DIR/Frameworks/"
          echo "Bundled: aosl.framework"

          install_name_tool \
            -add_rpath "@executable_path/../Frameworks" \
            "$APP_DIR/MacOS/Astation"

          cp Config/Info.plist "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RELEASE_VERSION" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" "$APP_DIR/Info.plist"

      - name: Sign, test protected Keychain access, and notarize app and installer
        env:
          ASTATION_RELEASE_REF: ${{ needs.prepare-release.outputs.version }}
          ASTATION_SIGNING_TEAM_ID: ${{ secrets.ASTATION_SIGNING_TEAM_ID }}
          ASTATION_APPLICATION_IDENTITY: ${{ secrets.ASTATION_APPLICATION_IDENTITY }}
          ASTATION_INSTALLER_IDENTITY: ${{ secrets.ASTATION_INSTALLER_IDENTITY }}
          ASTATION_SIGNING_CERTIFICATES_BASE64: ${{ secrets.ASTATION_SIGNING_CERTIFICATES_BASE64 }}
          ASTATION_SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.ASTATION_SIGNING_CERTIFICATES_PASSWORD }}
          ASTATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.ASTATION_PROVISIONING_PROFILE_BASE64 }}
          ASTATION_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.ASTATION_NOTARY_PRIVATE_KEY_BASE64 }}
          ASTATION_NOTARY_KEY_ID: ${{ secrets.ASTATION_NOTARY_KEY_ID }}
          ASTATION_NOTARY_ISSUER_ID: ${{ secrets.ASTATION_NOTARY_ISSUER_ID }}
        run: bash scripts/sign-release.sh

      - name: Verify signed app resources
        run: |
          app_executable="$PWD/Astation.app/Contents/MacOS/Astation"
          cd "$(mktemp -d)"
          env -u PACKAGE_RESOURCE_BUNDLE_PATH -u PACKAGE_RESOURCE_BUNDLE_URL \
            "$app_executable" --bundled-resources-check

      - name: Smoke-test packaged app
        run: |
          APP_EXECUTABLE="Astation.app/Contents/MacOS/Astation"
          SMOKE_LOG="$RUNNER_TEMP/astation-package-smoke.log"

          ASTATION_RELAY_URL="http://127.0.0.1:1" \
            "$APP_EXECUTABLE" >"$SMOKE_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID"
              wait "$APP_PID" || true
            fi
          }
          trap cleanup EXIT

          for _ in {1..5}; do
            sleep 1
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              if wait "$APP_PID"; then
                STATUS=0
              else
                STATUS=$?
              fi
              cat "$SMOKE_LOG"
              echo "Packaged app exited during smoke test (status $STATUS)" >&2
              exit 1
            fi
          done

          echo "Packaged app remained running for 5 seconds"
          cat "$SMOKE_LOG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astation-mac-arm64
          path: |
            dist/Astation-v${{ needs.prepare-release.outputs.version }}-mac-arm64.pkg
            dist/Astation-v${{ needs.prepare-release.outputs.version }}-mac-arm64.tar.gz
            dist/Astation-v${{ needs.prepare-release.outputs.version }}-mac-arm64.SHA256SUMS
          if-no-files-found: error

  check-server-changes:
    name: Check for relay-server/ changes
    needs: prepare-release
    runs-on: ubuntu-latest
    outputs:
      server_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if relay-server/ changed since last tag
        id: check
        run: |
          # Find the previous tag before the current one
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — treating relay-server as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- relay-server/ | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              echo "relay-server/ has $CHANGED changed files since $PREV_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes in relay-server/ since $PREV_TAG — skipping Docker build"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-server-docker:
    name: Build Station Relay Server Docker Image
    needs: [check-server-changes, build-app]
    if: github.event_name == 'push' && needs.check-server-changes.outputs.server_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and lowercase owner
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: relay-server
          platforms: linux/amd64
          push: true
          build-args: |
            ASTATION_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/station-relay-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/station-relay-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-webapp-changes:
    name: Check for webapp/ changes
    needs: prepare-release
    runs-on: ubuntu-latest
    outputs:
      webapp_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if webapp/ changed since last tag
        id: check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — treating webapp as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- webapp/ | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              echo "webapp/ has $CHANGED changed files since $PREV_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes in webapp/ since $PREV_TAG — skipping Docker build"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-webapp-docker:
    name: Build Session Web App Docker Image
    needs: [check-webapp-changes, build-app]
    if: github.event_name == 'push' && needs.check-webapp-changes.outputs.webapp_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and lowercase owner
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: webapp
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/station-webapp:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/station-webapp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [build-app, check-server-changes, check-webapp-changes, build-server-docker, build-webapp-docker]
    if: >-
      always() && github.event_name == 'push' && needs.build-app.result == 'success' &&
      needs.check-server-changes.result == 'success' && needs.check-webapp-changes.result == 'success' &&
      (needs.build-server-docker.result == 'success' || needs.build-server-docker.result == 'skipped') &&
      (needs.build-webapp-docker.result == 'success' || needs.build-webapp-docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: astation-mac-arm64
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Astation-${{ github.ref_name }}-mac-arm64.pkg
            dist/Astation-${{ github.ref_name }}-mac-arm64.tar.gz
            dist/Astation-${{ github.ref_name }}-mac-arm64.SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
