name: Mobile

on:
  pull_request:
    paths:
      - mobile/**
      - native-remote/**
      - Config/atem-client-*.json
      - scripts/check-atem-client-*.py
      - .github/workflows/mobile.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Mobile Analysis And Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Flutter revision
        run: |
          flutter --version --machine > /tmp/astation-flutter.json
          python3 - <<'PY'
          import json
          with open('/tmp/astation-flutter.json') as file:
              assert json.load(file)['frameworkRevision'] == 'c197ca5199e9ee5661e865596c9c07294dfab51c'
          PY
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool integration_test
          flutter analyze
          flutter test

  build:
    name: Mobile ${{ matrix.platform }} Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
          - platform: iOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare verified Android SDK
        if: matrix.platform == 'Android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-atem-client-android.py --install
      - name: Prepare verified Apple SDK
        if: matrix.platform == 'iOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          python3 scripts/check-atem-client-apple.py --install
      - name: Build Android debug APK
        if: matrix.platform == 'Android'
        working-directory: mobile
        run: flutter build apk --debug
      - name: Android native authentication tests
        if: matrix.platform == 'Android'
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Enable Android emulator acceleration
        if: matrix.platform == 'Android'
        run: sudo chmod a+rw /dev/kvm
      - name: Android OAuth callback routing
        if: matrix.platform == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd mobile/android && ./gradlew -Ptarget=lib/main.dart :app:connectedDebugAndroidTest
      - name: Build iOS simulator app
        if: matrix.platform == 'iOS'
        working-directory: mobile
        run: flutter build ios --simulator --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: astation-mobile-${{ matrix.platform }}-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7
