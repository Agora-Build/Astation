name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      head_sha:
        description: PR head commit to test
        required: true
        type: string
      pull_number:
        description: Open PR containing the commit
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.pull_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || '' }}

      - name: Select Xcode 26.2 (Foundation Models SDK)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Cache Agora SDK
        uses: actions/cache@v4
        with:
          path: third_party/agora
          key: agora-sdk-macos-4.7.0-sck

      - name: Configure C++ core (download SDK if needed)
        run: |
          SDK_DIR="third_party/agora"
          if [ -d "$SDK_DIR/rtc_mac" ]; then
            cmake -S . -B build -DBUILD_TESTING=ON -DAGORA_SKIP_DOWNLOAD=ON -DAGORA_SDK_DIR="$SDK_DIR"
          else
            if [ "${AGORA_SKIP_DOWNLOAD:-}" = "1" ]; then
              echo "AGORA_SKIP_DOWNLOAD=1 but SDK missing at $SDK_DIR" >&2
              exit 1
            fi
            cmake -S . -B build -DBUILD_TESTING=ON
          fi

      - name: Build C++ core
        run: |
          cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Build Swift package
        run: swift build -c release

      - name: Run Swift tests (no live audio or paid services)
        run: swift test

      - name: Verify development app bundle
        run: |
          swift build --product astation
          bash scripts/package-dev-app.sh
          app_executable="$PWD/.build/Astation Dev.app/Contents/MacOS/Astation"
          cd "$(mktemp -d)"
          env -u PACKAGE_RESOURCE_BUNDLE_PATH -u PACKAGE_RESOURCE_BUNDLE_URL \
            "$app_executable" --bundled-resources-check

  test-webapp:
    name: Webapp Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run webapp tests
        run: |
          node webapp/tests/codec.test.js
          node webapp/tests/nginx.test.js
          node --test webapp/tests/screen-share.test.js

      - name: Test AI review tooling
        run: node --test .github/scripts/*.test.mjs

  test-relay-server:
    name: Relay Server Tests
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay-server/target
            relay-server/loadtest/target
          key: ${{ runner.os }}-cargo-relay-${{ hashFiles('relay-server/Cargo.lock', 'relay-server/loadtest/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-relay-
      - name: Run relay server tests
        working-directory: relay-server
        run: cargo test --locked
      - name: Run isolated Postgres suites in parallel
        working-directory: relay-server
        env:
          IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/postgres
          KNOWLEDGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/postgres
          ACCOUNT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/postgres
        run: cargo test --locked -- --ignored --skip redis --test-threads=4
      - name: Run relay Redis (Valkey) suites
        working-directory: relay-server
        env:
          TEST_REDIS_URL: redis://127.0.0.1:56379/
        run: cargo test redis -- --ignored --test-threads=1
      - name: Test relay load test client
        working-directory: relay-server/loadtest
        run: cargo test --locked
      - name: Build relay server container
        env:
          BUILD_COMMIT: ${{ inputs.head_sha || github.sha }}
        run: docker build --build-arg ASTATION_BUILD_COMMIT="$BUILD_COMMIT" --tag station-relay-server:ci relay-server
      - name: Verify container build metadata
        env:
          EXPECTED_COMMIT: ${{ inputs.head_sha || github.sha }}
        run: |
          trap 'docker rm -f relay-build-check >/dev/null 2>&1' EXIT
          docker run --detach --name relay-build-check --publish 127.0.0.1:53000:3000 station-relay-server:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:53000/health > /tmp/relay-build-health.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/relay-build-health.json') as response:
              health = json.load(response)
          assert health['status'] == 'ok', health
          assert health['build_commit'] == os.environ['EXPECTED_COMMIT'], health
          assert health['version'] != '', health
          PY

  record-dispatch-context:
    if: github.event_name == 'workflow_dispatch'
    name: Record SMT CI Context
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Validate and write context
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head SHA." >&2
            exit 1
          fi
          if [[ ! "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/smt-ci-context"
          printf '{"headSha":"%s","pullNumber":%s}\n' \
            "$HEAD_SHA" "$PULL_NUMBER" \
            > "$RUNNER_TEMP/smt-ci-context/context.json"

      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: smt-ci-context
          path: ${{ runner.temp }}/smt-ci-context/context.json
          if-no-files-found: error
          retention-days: 1
