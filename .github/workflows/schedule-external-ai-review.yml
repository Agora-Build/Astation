name: Schedule External AI Review

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: schedule-external-ai-review
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout trusted scheduling tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Queue stable external pull requests
        run: node .github/scripts/schedule-external-reviews.mjs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXTERNAL_REVIEW_STABILITY_HOURS: "3"
          GITHUB_TOKEN: ${{ github.token }}
