name: SMT Review Command

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: smt-review-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '@smt')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout trusted command tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Handle @smt review
        run: node .github/scripts/smt-review-command.mjs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
