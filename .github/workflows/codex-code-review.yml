name: Codex Code Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: codex-review-${{ github.event.workflow_run.id || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.review.outputs.reviewed }}

    steps:
      # workflow_run uses the workflow and helper from the default branch. The
      # pull request is fetched through the API and is never executed here.
      - name: Checkout trusted review tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Inspect tested CI run
        id: ci-run
        run: node .github/scripts/inspect-ci-run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Download SMT CI context
        if: steps.ci-run.outputs.event == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: smt-ci-context
          path: ${{ runner.temp }}/smt-ci-context
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Review the tested pull request
        id: review
        run: node .github/scripts/ai-review.mjs
        env:
          AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_MODEL: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-5.5' }}
          AI_OUTPUT_PATH: ${{ runner.temp }}/codex-review.json
          AI_PROVIDER: codex
          CI_CONTEXT_PATH: ${{ steps.ci-run.outputs.event == 'workflow_dispatch' && format('{0}/smt-ci-context/context.json', runner.temp) || '' }}
          EXTERNAL_REVIEW_STABILITY_HOURS: "3"
          EXPECTED_CI_JOBS: Build macOS|Webapp Tests|Relay Server Tests
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Upload review output
        if: steps.review.outputs.reviewed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.event.workflow_run.id || inputs.ci_run_id }}
          path: ${{ runner.temp }}/codex-review.json
          if-no-files-found: error
          retention-days: 1

  post:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout trusted posting tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download review output
        uses: actions/download-artifact@v4
        with:
          name: codex-review-${{ github.event.workflow_run.id || inputs.ci_run_id }}
          path: ${{ runner.temp }}/review-output

      - name: Post review comment
        run: node .github/scripts/post-ai-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review-output/codex-review.json
