name: Claude Code Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.review.outputs.reviewed }}

    steps:
      # workflow_run uses the workflow and helper from the default branch. The
      # pull request is fetched through the API and is never executed here.
      - name: Checkout trusted review tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Review the tested pull request
        id: review
        run: node .github/scripts/ai-review.mjs
        env:
          AI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          AI_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-4-8' }}
          AI_OUTPUT_PATH: ${{ runner.temp }}/claude-review.json
          AI_PROVIDER: claude
          EXPECTED_CI_JOBS: Build macOS|Webapp Tests|Relay Server Tests
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Upload review output
        if: steps.review.outputs.reviewed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/claude-review.json
          if-no-files-found: error
          retention-days: 1

  post:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout trusted posting tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download review output
        uses: actions/download-artifact@v4
        with:
          name: claude-review-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/review-output

      - name: Post review comment
        run: node .github/scripts/post-ai-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review-output/claude-review.json
