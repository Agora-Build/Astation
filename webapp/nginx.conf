upstream station_relay_upstream {
    # Coolify replaces containers on deploy; refresh their Docker DNS addresses.
    zone station_relay_upstream 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ${STATION_RELAY_UPSTREAM} resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: all /session/* routes serve index.html
    location /session/ {
        try_files $uri /index.html;
    }

    # Proxy API and auth requests to the relay server
    location /api/ {
        proxy_pass http://station_relay_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://station_relay_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://station_relay_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pair {
        proxy_pass http://station_relay_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        # Explicit URI forwards nginx's normalized path for older clients using //ws.
        proxy_pass http://station_relay_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static assets
    location / {
        try_files $uri $uri/ =404;
    }
}
