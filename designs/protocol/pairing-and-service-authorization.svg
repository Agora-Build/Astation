<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1100" viewBox="0 0 1040 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pairing and service authorization</title>
  <desc id="desc">One guided pairing flow moves from Agora.Build login through a temporary code, Station routing, device verification, owner confirmation and durable signed enrollment. Verified devices can use permitted agent features. Optional service authorization is separate. Station routing and account login do not establish device trust.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#506475" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #203746; }
      .heading { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526675; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 16px; fill: #526675; }
      .step { font-size: 15px; font-weight: 700; fill: #486274; }
      .line { fill: none; stroke: #506475; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #c4cfd5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1040" height="1100" rx="18" fill="#f4f7f8"/>
  <text x="520" y="44" text-anchor="middle" class="heading">One pairing flow. Separate service access.</text>
  <text x="520" y="72" text-anchor="middle" class="subtitle">Proposed design for review</text>

  <rect x="245" y="102" width="550" height="76" rx="12" class="box"/>
  <text x="267" y="131" class="step">01</text>
  <text x="520" y="133" text-anchor="middle" class="label">Sign in to Agora.Build</text>
  <text x="520" y="159" text-anchor="middle" class="body">Identify the account for account APIs</text>
  <path d="M520 178 V204" class="line"/>

  <rect x="245" y="208" width="550" height="76" rx="12" class="box"/>
  <text x="267" y="237" class="step">02</text>
  <text x="520" y="239" text-anchor="middle" class="label">Pair Atem</text>
  <text x="520" y="265" text-anchor="middle" class="body">Enter the temporary pairing code</text>
  <path d="M520 284 V310" class="line"/>

  <rect x="245" y="314" width="550" height="76" rx="12" fill="#fff8e9" stroke="#d8bc7f" stroke-width="1.5"/>
  <text x="267" y="343" class="step">03</text>
  <text x="520" y="345" text-anchor="middle" class="label">Connect through the selected Station</text>
  <text x="520" y="371" text-anchor="middle" class="body">A routing introduction contains no service tokens</text>
  <path d="M795 352 H827" fill="none" stroke="#a58b54" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="840" y="335" class="body">
    <tspan x="840">Routing is</tspan>
    <tspan x="840" dy="23">not proof</tspan>
    <tspan x="840" dy="23">of identity</tspan>
  </text>
  <path d="M520 390 V416" class="line"/>

  <rect x="245" y="420" width="550" height="86" rx="12" class="box"/>
  <text x="267" y="451" class="step">04</text>
  <text x="520" y="452" text-anchor="middle" class="label">Verify the devices</text>
  <text x="520" y="480" text-anchor="middle" class="body">Check device-key proofs and compare safety codes</text>
  <path d="M520 506 V532" class="line"/>

  <rect x="245" y="536" width="550" height="86" rx="12" class="box"/>
  <text x="267" y="567" class="step">05</text>
  <text x="520" y="568" text-anchor="middle" class="label">Confirm and save enrollment</text>
  <text x="520" y="596" text-anchor="middle" class="body">Owner authentication and durable signed membership</text>
  <path d="M520 622 V648" class="line"/>

  <rect x="245" y="652" width="550" height="86" rx="12" fill="#e6f3ee" stroke="#72a892" stroke-width="1.5"/>
  <text x="267" y="683" class="step">06</text>
  <text x="520" y="684" text-anchor="middle" class="label">Verified Atem</text>
  <text x="520" y="712" text-anchor="middle" class="body">Encrypted R9 access under existing trust and permissions</text>

  <path d="M520 738 V767 H286 V810" class="line"/>
  <path d="M520 767 H754 V810" class="line" stroke-dasharray="5 5"/>
  <text x="754" y="756" text-anchor="middle" class="body">Only when needed</text>
  <rect x="70" y="814" width="432" height="128" rx="12" class="box"/>
  <text x="286" y="849" text-anchor="middle" class="label">Agent features</text>
  <text x="286" y="880" text-anchor="middle" class="body">Sessions, chat, terminal and approvals</text>
  <text x="286" y="906" text-anchor="middle" class="body">R9 permissions and control rules still apply</text>
  <rect x="538" y="814" width="432" height="128" rx="12" class="box"/>
  <text x="754" y="849" text-anchor="middle" class="label">Optional service access</text>
  <text x="754" y="880" text-anchor="middle" class="body">For example, authorize Agora project tools</text>
  <text x="754" y="906" text-anchor="middle" class="body">Scope, expire and revoke independently</text>

  <rect x="70" y="978" width="900" height="88" rx="12" fill="#e8edf1"/>
  <text x="520" y="1008" text-anchor="middle" class="label">Trust stays at the endpoints</text>
  <text x="520" y="1038" text-anchor="middle" class="body">Station cannot approve a device. Native Portal and Station login tokens stay native.</text>
</svg>
